[package]
name = "verba"
version = "0.2.3"
description = "Minimal macOS desktop dictation app"
authors = ["Verba contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.83"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
cpal = "0.16"
hound = "3.5"
flacenc = { version = "0.5.1", default-features = false }
tempfile = "3"
arboard = "3.4"
thiserror = "2.0"
tokio = { version = "1", features = ["sync"] }
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[dev-dependencies]
claxon = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
