<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recording Overlay</title>
    <style>
      :root { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; color: #f5f5f5; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      [hidden] { display: none !important; }
      .overlay { opacity: 0; pointer-events: none; transform: translateY(2px); transition: opacity 120ms ease, transform 150ms cubic-bezier(.22,1,.36,1); }
      .overlay.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
      .overlay-pill { display: flex; align-items: center; justify-content: space-between; width: 104px; height: 30px; padding: 3px; box-sizing: border-box; border: 1px solid #555; border-radius: 999px; background: #090909; box-shadow: 0 2px 5px #0003; }
      button { font: inherit; cursor: pointer; border: 0; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      button:disabled { cursor: default; opacity: .45; }
      .icon-button { display: grid; place-items: center; flex: 0 0 22px; height: 22px; padding: 2px; background: transparent; border-radius: 50%; color: #fff; }
      .icon-button svg { width: 18px; height: 18px; }
      .icon-button:hover:not(:disabled) { background: #ffffff38; }
      .overlay-waveform { display: flex; align-items: center; justify-content: center; gap: 1.5px; width: 40px; height: 16px; }
      .overlay-bar { width: 1.5px; height: 16px; border-radius: 1px; background: #f5f5f5; transform: scaleY(.14); transition: transform 90ms cubic-bezier(.22,1,.36,1); }
      .overlay-spinner { display: none; width: 10px; height: 10px; margin: 0 13px; border: 2px solid #ffffff40; border-top-color: #f5f5f5; border-radius: 50%; animation: overlay-spin 760ms linear infinite; }
      [data-tone="processing"] .overlay-waveform { display: none; }
      [data-tone="processing"] .overlay-spinner { display: block; }
      .save-prompt { width: 240px; padding: 12px; box-sizing: border-box; border: 1px solid #555; border-radius: 12px; background: #090909; box-shadow: 0 2px 5px #0003; }
      .save-prompt p { margin: 0; font-size: 13px; font-weight: 500; }
      .save-prompt .note { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; color: #bdbdbd; font-size: 11px; font-weight: 400; }
      .prompt-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
      .prompt-actions button { min-height: 25px; padding: 4px 12px; border-radius: 5px; background: #303030; color: #f5f5f5; }
      .prompt-actions button:last-child { background: #f5f5f5; color: #111; }
      .prompt-actions button:hover:not(:disabled) { filter: brightness(.85); }
      @keyframes overlay-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="overlay" class="overlay" data-tone="idle" aria-hidden="true">
      <div id="overlay-pill" class="overlay-pill" role="group" aria-label="Dictation controls">
        <button id="interrupt" class="icon-button" type="button" aria-label="Interrupt recording (Esc)" title="Interrupt (Esc)">
          <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="#57554e"/><path d="m6.2 6.2 5.6 5.6m0-5.6-5.6 5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <div class="overlay-waveform" aria-hidden="true">
          <span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span><span class="overlay-bar"></span>
        </div>
        <span class="overlay-spinner" role="status" aria-label="Transcribing"></span>
        <button id="finish" class="icon-button" type="button" aria-label="Finish and transcribe" title="Finish and transcribe">
          <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="#f5f5f5"/><path d="m5.7 9 2.1 2.2 4.5-4.6" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="save-prompt" class="save-prompt" role="group" aria-labelledby="save-title" hidden>
        <p id="save-title">Save recording?</p>
        <p id="prompt-note" class="note" role="status">Discarded audio stays in History.</p>
        <div class="prompt-actions">
          <button id="discard" type="button">Discard</button>
          <button id="save" type="button">Save</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
